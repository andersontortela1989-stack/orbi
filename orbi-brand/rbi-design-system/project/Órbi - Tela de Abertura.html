<!-- @dsCard group="Telas" viewport="1280x800" name="Tela de abertura" subtitle="Logo + Órbi acenando + tagline + JOGAR · clima adesivo" -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Órbi · Tela de Abertura</title>
<link rel="stylesheet" href="styles.css" />
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--font-body);
    background:#A7DCF0;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;}

  /* fixed game canvas, scaled to fit */
  .screen{
    width:1280px;height:800px;position:relative;overflow:hidden;flex:none;
    transform-origin:center center;
    background:
      radial-gradient(120% 95% at 50% 8%, var(--orbi-sky-hi) 0%, var(--orbi-sky) 45%, var(--orbi-sky-deep) 100%);
  }

  /* ---------------- decor ---------------- */
  .decor{position:absolute;inset:0;z-index:1;pointer-events:none;}
  .cloud{position:absolute;background:#fff;border:var(--outline) solid var(--ink);border-radius:var(--radius-pill);box-shadow:var(--solid-1);}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border:var(--outline) solid var(--ink);border-radius:50%;}
  .cloud.c-a{width:150px;height:46px;left:150px;top:150px;}
  .cloud.c-a::before{width:60px;height:60px;left:24px;top:-30px;}
  .cloud.c-a::after{width:46px;height:46px;left:80px;top:-20px;}
  .cloud.c-b{width:120px;height:40px;right:190px;top:120px;opacity:.96;}
  .cloud.c-b::before{width:52px;height:52px;left:20px;top:-26px;}
  .cloud.c-b::after{width:40px;height:40px;left:64px;top:-16px;}
  .cloud.c-c{width:96px;height:32px;left:60px;top:330px;opacity:.9;}
  .cloud.c-c::before{width:40px;height:40px;left:16px;top:-20px;}
  .cloud.c-c::after{width:30px;height:30px;left:50px;top:-12px;}
  /* mask the navy outline where the bumps meet the bar */
  .cloud i{position:absolute;left:6px;right:6px;top:3px;bottom:3px;background:#fff;border-radius:var(--radius-pill);z-index:1;}

  .spark{position:absolute;}

  /* sun-planet, top-left */
  .sun-planet{position:absolute;top:54px;left:70px;}

  /* hill + city */
  .ground{position:absolute;left:0;right:0;bottom:0;height:300px;z-index:2;}
  .ground svg{width:100%;height:100%;display:block;}

  /* ---------------- content ---------------- */
  .content{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;
           padding:54px 40px 40px;}
  .logo{display:flex;flex-direction:column;align-items:center;gap:18px;}
  .wm{font-family:var(--font-display);font-weight:700;line-height:1;font-size:112px;color:#fff;
      -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink);
      display:inline-block;white-space:nowrap;}
  .o-unit{position:relative;display:inline-block;}
  .acc{position:absolute;left:50%;transform:translateX(-50%);top:-.46em;width:.74em;height:.74em;
       -webkit-text-stroke:0;text-shadow:none;}
  .tagline{font-family:var(--font-display);font-weight:700;font-size:27px;color:var(--orbi-ink);
           background:var(--orbi-sun);border:var(--outline) solid var(--ink);border-radius:var(--radius-pill);
           padding:9px 28px;box-shadow:var(--solid-2);white-space:nowrap;}

  /* character */
  .orbi-wrap{flex:1;display:flex;align-items:center;justify-content:center;margin-top:4px;position:relative;}
  .orbi{width:300px;animation:bob 4.2s var(--ease-soft) infinite;}
  .orbi svg{width:100%;height:auto;display:block;filter:drop-shadow(0 14px 0 rgba(28,39,70,.14));}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg);}50%{transform:translateY(-14px) rotate(1.5deg);}}

  /* speech bubble on play */
  .bubble{position:absolute;top:6px;left:calc(50% + 120px);font-family:var(--font-display);font-weight:700;
          font-size:22px;color:var(--orbi-ink);background:#fff;border:var(--outline) solid var(--ink);
          border-radius:var(--radius-lg);padding:10px 18px;box-shadow:var(--solid-2);opacity:0;transform:scale(.6) translateY(8px);
          transition:opacity var(--dur-quick) var(--ease-soft),transform var(--dur-quick) var(--ease-pop,var(--ease-soft));pointer-events:none;}
  .bubble::after{content:"";position:absolute;left:-12px;bottom:14px;width:18px;height:18px;background:#fff;
                 border-left:var(--outline) solid var(--ink);border-bottom:var(--outline) solid var(--ink);transform:rotate(45deg);}
  .bubble.show{opacity:1;transform:scale(1) translateY(0);}

  /* JOGAR button */
  .play{font-family:var(--font-display);font-weight:700;font-size:42px;letter-spacing:.02em;
        color:var(--orbi-ink);background:var(--orbi-sun);border:var(--outline-bold) solid var(--ink);
        border-radius:var(--radius-pill);padding:20px 68px;cursor:pointer;
        box-shadow:0 9px 0 var(--ink);display:inline-flex;align-items:center;gap:18px;margin-bottom:14px;
        transition:transform var(--dur-quick) var(--ease-soft),box-shadow var(--dur-quick) var(--ease-soft),background var(--dur-quick) var(--ease-soft);
        animation:invite 2.4s var(--ease-soft) infinite;}
  .play:hover{background:var(--orbi-sun-soft);}
  .play:active,.play.press{transform:translateY(6px);box-shadow:0 3px 0 var(--ink);animation:none;}
  .play .tri{width:0;height:0;border-style:solid;border-width:18px 0 18px 30px;border-color:transparent transparent transparent var(--orbi-ink);}
  @keyframes invite{0%,88%,100%{transform:translateY(0) scale(1);}94%{transform:translateY(-2px) scale(1.03);}}

  @media (prefers-reduced-motion: reduce){
    .orbi,.play{animation:none!important;}
  }

  /* corner controls */
  .controls{position:absolute;top:30px;right:34px;z-index:4;display:flex;gap:16px;}
  .rbtn{width:66px;height:66px;border-radius:var(--radius-pill);background:#fff;border:var(--outline) solid var(--ink);
        box-shadow:var(--solid-2);cursor:pointer;display:flex;align-items:center;justify-content:center;
        transition:transform var(--dur-quick) var(--ease-soft),box-shadow var(--dur-quick) var(--ease-soft);}
  .rbtn:active{transform:translateY(4px);box-shadow:var(--solid-press);}
  .rbtn svg{display:block;}

  .parents{position:absolute;bottom:26px;right:34px;z-index:4;display:inline-flex;align-items:center;gap:9px;white-space:nowrap;
           font-family:var(--font-display);font-weight:700;font-size:16px;color:var(--orbi-ink-soft);
           background:rgba(255,255,255,.7);border:var(--outline-thin) solid var(--orbi-ink-soft);
           border-radius:var(--radius-pill);padding:8px 16px;cursor:pointer;}
  .parents:hover{color:var(--orbi-ink);border-color:var(--orbi-ink);}
</style>
</head>
<body>

<template id="__bundler_thumbnail" data-bg-color="#DDF1FA">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#DDF1FA"/>
    <text x="600" y="330" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="150" fill="#fff" stroke="#1C2746" stroke-width="14" style="paint-order:stroke">Órbi</text>
    <rect x="420" y="560" width="360" height="110" rx="55" fill="#FFC53D" stroke="#1C2746" stroke-width="10"/>
    <text x="600" y="635" text-anchor="middle" font-family="Fredoka, sans-serif" font-weight="700" font-size="58" fill="#1C2746">JOGAR</text>
  </svg>
</template>

<div class="stage">
  <div class="screen" id="screen">

    <!-- DECOR -->
    <div class="decor">
      <!-- sun planet -->
      <svg class="sun-planet" width="96" height="96" viewBox="0 0 96 96">
        <circle cx="48" cy="48" r="30" fill="#FFC53D" stroke="#1C2746" stroke-width="6"/>
        <ellipse cx="48" cy="48" rx="44" ry="14" transform="rotate(-22 48 48)" fill="none" stroke="#1C2746" stroke-width="5"/>
      </svg>

      <div class="cloud c-a"><i></i></div>
      <div class="cloud c-b"><i></i></div>
      <div class="cloud c-c"><i></i></div>

      <!-- sparkles -->
      <svg class="spark" style="left:540px;top:120px;" width="34" height="34" viewBox="0 0 34 34"><path d="M17 1 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#FFC53D" stroke="#1C2746" stroke-width="3"/></svg>
      <svg class="spark" style="right:120px;top:300px;" width="26" height="26" viewBox="0 0 34 34"><path d="M17 1 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#F0623E" stroke="#1C2746" stroke-width="3"/></svg>
      <svg class="spark" style="left:240px;top:470px;" width="22" height="22" viewBox="0 0 34 34"><path d="M17 1 l4 12 12 4 -12 4 -4 12 -4 -12 -12 -4 12 -4 z" fill="#58B6E8" stroke="#1C2746" stroke-width="3"/></svg>
    </div>

    <!-- HILL + CITY -->
    <div class="ground">
      <svg viewBox="0 0 1280 300" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
        <!-- city behind, sitting on the hill, recessed -->
        <g opacity="0.96">
          <!-- left cluster -->
          <g>
            <rect x="150" y="92" width="74" height="96" rx="14" fill="#BEE5F8" stroke="#1C2746" stroke-width="5"/>
            <rect x="166" y="110" width="18" height="18" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="192" y="110" width="18" height="18" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="232" y="64" width="64" height="124" rx="14" fill="#FFE0A0" stroke="#1C2746" stroke-width="5"/>
            <rect x="248" y="84" width="16" height="16" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="270" y="84" width="16" height="16" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="248" y="114" width="16" height="16" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="270" y="114" width="16" height="16" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
          </g>
          <!-- right cluster -->
          <g>
            <rect x="980" y="74" width="68" height="116" rx="14" fill="#BDE8C5" stroke="#1C2746" stroke-width="5"/>
            <rect x="997" y="94" width="16" height="16" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="1019" y="94" width="16" height="16" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="1056" y="98" width="74" height="92" rx="14" fill="#FBC4B5" stroke="#1C2746" stroke-width="5"/>
            <rect x="1073" y="116" width="18" height="18" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
            <rect x="1099" y="116" width="18" height="18" rx="4" fill="#fff" stroke="#1C2746" stroke-width="3"/>
          </g>
        </g>
        <!-- hill -->
        <path d="M0 120 Q 360 64 640 96 Q 960 128 1280 92 L1280 300 L0 300 Z" fill="#5BBE6E" stroke="#1C2746" stroke-width="6"/>
        <!-- soft mounds for texture -->
        <path d="M120 300 Q 220 214 320 300 Z" fill="#3F9E52" opacity="0.28"/>
        <path d="M900 300 Q 1010 206 1120 300 Z" fill="#3F9E52" opacity="0.28"/>
      </svg>
    </div>

    <!-- CONTENT -->
    <div class="content">
      <div class="logo">
        <span class="wm"><span class="o-unit">O<span class="acc">
          <svg viewBox="0 0 60 60" width="100%" height="100%"><circle cx="30" cy="30" r="20" fill="#FFC53D" stroke="#1C2746" stroke-width="6"/><ellipse cx="30" cy="30" rx="29" ry="9" transform="rotate(-20 30 30)" fill="none" stroke="#1C2746" stroke-width="5"/></svg>
        </span></span>rbi</span>
        <span class="tagline">um mundo pra descobrir</span>
      </div>

      <div class="orbi-wrap">
        <div class="orbi" id="orbi"></div>
        <div class="bubble" id="bubble">Vamos explorar!</div>
      </div>

      <button class="play" id="play" aria-label="Jogar">
        <span class="tri"></span>JOGAR
      </button>
    </div>

    <!-- CONTROLS -->
    <div class="controls">
      <button class="rbtn" id="sound" aria-label="Som ligado">
        <svg id="sound-ic" width="30" height="30" viewBox="0 0 30 30" fill="none">
          <path d="M5 11 H10 L16 6 V24 L10 19 H5 Z" fill="#FFC53D" stroke="#1C2746" stroke-width="2.6" stroke-linejoin="round"/>
          <path class="waves" d="M20 11 Q23 15 20 19 M23 8 Q28 15 23 22" stroke="#1C2746" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        </svg>
      </button>
    </div>

    <button class="parents" id="parents" aria-label="Área dos pais">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="4" y="10" width="16" height="11" rx="3" fill="#fff" stroke="#46557E" stroke-width="2.4"/><path d="M8 10 V7 a4 4 0 0 1 8 0 V10" stroke="#46557E" stroke-width="2.4" fill="none"/></svg>
      Área dos pais
    </button>

  </div>
</div>

<script src="assets/orbi.js"></script>
<script>
  (function () {
    var O = window.OrbiChar;
    var orbi = document.getElementById('orbi');
    orbi.innerHTML = O.svg('acenando');

    // scale the fixed canvas to fit any viewport
    var screen = document.getElementById('screen');
    function fit(){
      var s = Math.min(window.innerWidth / 1280, window.innerHeight / 800);
      if (s > 0) screen.style.transform = 'scale(' + s + ')'; // never lock in scale(0)
    }
    window.addEventListener('resize', fit);
    window.addEventListener('load', fit);
    fit();
    requestAnimationFrame(fit);

    // JOGAR — playful feedback (no navigation in mock)
    var play = document.getElementById('play');
    var bubble = document.getElementById('bubble');
    var busy = false;
    play.addEventListener('click', function () {
      if (busy) return; busy = true;
      play.classList.add('press');
      orbi.innerHTML = O.svg('comemorando');
      bubble.classList.add('show');
      setTimeout(function () {
        play.classList.remove('press');
        bubble.classList.remove('show');
        orbi.innerHTML = O.svg('acenando');
        busy = false;
      }, 1700);
    });

    // sound toggle
    var sound = document.getElementById('sound');
    var waves = document.querySelector('#sound-ic .waves');
    var on = true;
    sound.addEventListener('click', function () {
      on = !on;
      waves.style.display = on ? '' : 'none';
      sound.setAttribute('aria-label', on ? 'Som ligado' : 'Som desligado');
    });

    document.getElementById('parents').addEventListener('click', function (e) {
      e.preventDefault();
    });
  })();
</script>

</body>
</html>
