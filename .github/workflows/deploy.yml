name: Deploy to Cloudflare Pages

# Deploy automático a cada push na main. O projeto Pages "orbi" foi criado via
# Direct Upload (wrangler) e é mantido assim de propósito — NÃO conectar o Pages
# ao Git pelo dashboard (perderia a URL orbi-3ge.pages.dev e o custom domain).
# Este workflow faz o mesmo `wrangler pages deploy` que rodávamos à mão, agora no CI.
on:
  push:
    branches: [main]
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # wrangler-action instala o próprio wrangler e roda o comando. dist é
      # gitignored, então a árvore fica limpa no CI (sem --commit-dirty) e o
      # wrangler carimba o commit do checkout no deploy.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=orbi
