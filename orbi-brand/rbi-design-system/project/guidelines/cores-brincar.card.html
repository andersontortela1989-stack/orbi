<!-- @dsCard group="Colors" viewport="700x210" name="Cores de brincar" subtitle="Sol · capim · coral · céu-forte" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;font-family:var(--font-body);background:var(--orbi-sky);padding:22px 20px;}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .sw{border-radius:var(--radius-md);overflow:hidden;background:var(--orbi-white);
      border:var(--outline) solid var(--ink);box-shadow:var(--solid-2);}
  .chip{height:64px;border-bottom:var(--outline) solid var(--ink);}
  .m{padding:7px 10px 9px;}
  .nm{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--orbi-ink);}
  .hx{font-size:11px;letter-spacing:.04em;color:var(--orbi-ink-soft);text-transform:uppercase;margin-top:1px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--orbi-sun)"></div><div class="m"><div class="nm">Sol</div><div class="hx">#FFC53D</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orbi-grass)"></div><div class="m"><div class="nm">Capim</div><div class="hx">#5BBE6E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orbi-coral)"></div><div class="m"><div class="nm">Coral</div><div class="hx">#F0623E</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orbi-blue)"></div><div class="m"><div class="nm">Céu-forte</div><div class="hx">#58B6E8</div></div></div>
  </div>
</body></html>
