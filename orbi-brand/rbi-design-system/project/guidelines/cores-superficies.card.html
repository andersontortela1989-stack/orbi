<!-- @dsCard group="Colors" viewport="700x210" name="Superfícies — céu claro" subtitle="Fundo arejado + recheio branco do adesivo" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"/>
<link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;font-family:var(--font-body);background:var(--orbi-sky);padding:22px 20px;}
  .row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .sw{border-radius:var(--radius-md);overflow:hidden;background:var(--orbi-white);
      border:var(--outline) solid var(--ink);box-shadow:var(--solid-2);}
  .chip{height:64px;border-bottom:var(--outline) solid var(--ink);}
  .m{padding:7px 10px 9px;}
  .nm{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--orbi-ink);}
  .hx{font-size:11px;letter-spacing:.04em;color:var(--orbi-ink-soft);text-transform:uppercase;margin-top:1px;}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--orbi-sky)"></div><div class="m"><div class="nm">Céu claro</div><div class="hx">#DDF1FA</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orbi-sky-deep)"></div><div class="m"><div class="nm">Céu fundo</div><div class="hx">#A7DCF0</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orbi-white)"></div><div class="m"><div class="nm">Branco-recheio</div><div class="hx">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:var(--orbi-paper)"></div><div class="m"><div class="nm">Papel</div><div class="hx">#FBF7EF</div></div></div>
  </div>
</body></html>
